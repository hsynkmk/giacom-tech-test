name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Order.sln

      - name: Build
        run: dotnet build src/Order.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Order.sln --configuration Release --no-build --verbosity normal

  # This is the same image docker-compose builds, so a broken Dockerfile is caught here too
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build ./src --tag order-api:ci
